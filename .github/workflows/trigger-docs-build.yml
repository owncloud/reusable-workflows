name: Trigger Docs Build

on:
  workflow_call:
    secrets:
      DOCS_TRIGGER_APP_ID:
        required: true
      DOCS_TRIGGER_APP_PRIVATE_KEY:
        required: true

jobs:
  trigger:
    name: Trigger owncloud/docs rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DOCS_TRIGGER_APP_ID }}
          private-key: ${{ secrets.DOCS_TRIGGER_APP_PRIVATE_KEY }}
          owner: owncloud
          repositories: docs
          permission-actions: write

      - name: Trigger docs rebuild
        run: |
          gh api repos/owncloud/docs/actions/workflows/ci.yml/dispatches \
            --method POST \
            --field ref=master
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
