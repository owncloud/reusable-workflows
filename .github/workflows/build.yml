on:
  workflow_call:
    inputs:
      app-name:
        description: 'Name of the app (used for the artifact name, defaults to the repository name)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: make dist

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ case(inputs.app-name != '', inputs.app-name, github.event.repository.name) }}
          path: build/**/*.tar.gz
